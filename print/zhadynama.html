<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<title>Оқушы жадынамасы · Экосканер</title>
<link rel="stylesheet" href="../vendor/golos.css">
<script src="../data.js"></script>
<style>
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Golos Text',sans-serif;color:#13233a;background:#d9e3ee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;background:#fff;margin:0 auto;display:grid;grid-template-rows:1fr 1fr}
@media print{body{background:#fff}}
.card{padding:8mm 10mm 7mm;display:flex;flex-direction:column;gap:2.6mm;position:relative}
.card+.card{border-top:.4mm dashed #9fb0c3}
.hd{display:flex;align-items:center;gap:3.5mm;background:linear-gradient(120deg,#004A5C,#00799A);color:#fff;border-radius:5mm;padding:3mm 4.5mm}
.hd .e{font-size:22pt}
.hd small{font-size:7.5pt;font-weight:800;letter-spacing:.12em;color:#9FE7F2}
.hd h1{font-size:15pt;line-height:1.1}
.hd p{font-size:8.5pt;opacity:.95}
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:2.2mm}
.s{border-radius:3.5mm;padding:2.2mm 2.8mm;background:var(--b);border:.35mm solid var(--c);display:flex;flex-direction:column;gap:.8mm}
.s .t{display:flex;align-items:center;gap:1.8mm;font-weight:800;font-size:10pt;color:var(--c)}
.s .t i{font-style:normal;width:6mm;height:6mm;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:8.5pt;flex:none}
.s p{font-size:8.6pt;line-height:1.3}
.s .tl{margin-top:auto;font-size:8pt;font-weight:800}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:2.2mm}
.r{border-radius:3.5mm;padding:2.2mm 2.8mm;font-size:8.6pt;line-height:1.3}
.r b{display:block;font-size:10pt;margin-bottom:.5mm}
.tip{background:#FFF7E6;border-radius:3.5mm;padding:2mm 3mm;font-size:9pt;font-weight:700;color:#7A4A00;text-align:center}
.me{display:flex;gap:3mm;font-size:9pt;align-items:center}
.me span{flex:1;border-bottom:.3mm solid #9fb0c3;padding-bottom:1mm}
</style></head><body>
<script>
const R = [
 ["#0E7490", "#E6F6F8", "0–8 мин", "Басы · үй тапсырмасы · бейне", "«Экоауа райы»: көңіл-күйіңді айт → тобың мен рөлің → «ыстық орындық» → бейнені көр, мақсатты біл.", "📵 телефон жинаулы"],
 ["#00799A", "#E8F6F8", "8–16 мин", "6 спикер — 6 ғалым", "Спикерлер ғалым рөлінде 1 минуттан түсіндіреді. Сен №1 кестеге жазасың: ұғым, мысал, сан.", "✍️ №1 парақ"],
 ["#0369A1", "#E6F1FB", "16–24 мин", "3D глобус", "Платформа кездейсоқ таңдайды: атың шықса — тақтаға шығып жауапты бас. Қалғандары ойша жауап береді.", "👆 тақтада"],
 ["#7C3AED", "#F3EEFF", "24–28 мин", "«ЖИ-ді тексер»", "№2 парақта бөліп, қос: ЖИ мен оқулық дұрыс па? Хатшы кілтпен тексереді.", "✍️ №2 парақ"],
 ["#D97706", "#FFF4E5", "28–37 мин", "Постер «Диагноз қой»", "3 мин: досье (№3) → ватманға постер. Сосын әр топ 2 минут қорғайды, басқалар 1 сұрақ қояды.", "🖼 ватман"],
 ["#B45309", "#FFF7E0", "37–45 мин", "Квиз → баға → пікір", "Енді ғана телефонды ал: QR → атың → 6 сұрақ. Сосын балың, үздіктер, пікір: ұтымды · қызықты · ұсыныс.", "📱 телефон — тек осы жерде"]
];
const card = () => `<div class="card">
  <div class="hd"><div class="e">🧑‍🎓</div><div><small>ОҚУШЫ ЖАДЫНАМАСЫ · ЭКОСКАНЕР</small><h1>Бүгінгі сабақта мен не істеймін?</h1><p>${DATA.lesson.subject} · ${DATA.lesson.topic} · ${DATA.lesson.date}</p></div></div>
  <div class="me"><span>Атым: </span><span>Тобым: </span><span>Рөлім: </span></div>
  <div class="road">${R.map((x, i) => `<div class="s" style="--c:${x[0]};--b:${x[1]}"><div class="t"><i>${i + 1}</i>${x[3]}</div><p><b>${x[2]}.</b> ${x[4]}</p><div class="tl">${x[5]}</div></div>`).join("")}</div>
  <div class="rules">
   <div class="r" style="background:#FEE2E2"><b>📵 Телефон</b>Квизге дейін сөмкеде. Тек хатшы ғана балл қою үшін алады.</div>
   <div class="r" style="background:#E0E7FF"><b>✍️ Парақ → хатшы</b>Тапсырманы парақта орында, тақтадан тексер, парақты хатшыға бер — ол балл қояды.</div>
   <div class="r" style="background:#DCFCE7"><b>🎭 Рөлдер</b>🎤 спикер — түсіндіреді · 📒 хатшы — балл қояды · 🖼 постер қорғаушы — 2 мин қорғайды.</div>
  </div>
  <div class="tip">Не істерін білмесең — тақтаға қара: әр кезеңде «🧑‍🎓 Сен не істейсің? 1 → 2 → 3» жолағы тұрады.</div>
</div>`;
document.body.innerHTML = `<section class="page">${card()}${card()}</section>`;
</script>
</body></html>
