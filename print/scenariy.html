<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сабақты өткізу сценарийі · Экосканер</title>
<link rel="stylesheet" href="../vendor/golos.css">
<script src="../data.js"></script><script src="../scenariy-data.js"></script>
<style>
@page{size:A4;margin:11mm 12mm 12mm}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Golos Text',sans-serif;color:#13233a;-webkit-print-color-adjust:exact;print-color-adjust:exact;max-width:186mm;margin:0 auto;padding:6mm 0;font-size:10.5pt;line-height:1.38}
@media screen{body{padding:16px;max-width:820px}}
.hero{background:linear-gradient(120deg,#004A5C,#00799A);color:#fff;border-radius:6mm;padding:5mm 6mm;margin-bottom:4mm}
.hero small{font-weight:800;letter-spacing:.12em;color:#9FE7F2;font-size:8.5pt}
.hero h1{font-size:20pt;line-height:1.1;margin:1mm 0}
.hero p{font-size:9.5pt;opacity:.95}
h2{font-size:12.5pt;color:#004A5C;margin:4mm 0 2mm}
.chk{display:grid;gap:1.6mm;margin-bottom:3mm}
.chk div{display:flex;gap:2.4mm;background:#F1FAFB;border-radius:3mm;padding:2mm 3mm;font-size:10pt}
.chk div::before{content:"☐";font-size:12pt;color:#00799A;line-height:1.1}
.rule{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4mm;margin-bottom:2mm}
.rule div{border-radius:3mm;padding:2.4mm 3mm;font-size:9.5pt;font-weight:700;background:#FFF7E6;color:#7A4A00}
.rule b{display:block;font-size:11pt}
.st{border:.35mm solid #CFE3E8;border-radius:4mm;padding:3mm 3.6mm;margin-bottom:2.8mm;break-inside:avoid;page-break-inside:avoid}
.st .h{display:flex;align-items:center;gap:2.6mm;margin-bottom:1.6mm}
.st .n{flex:none;width:8.5mm;height:8.5mm;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:11pt}
.st .h b{font-size:11.5pt;line-height:1.15}
.st .h span{margin-left:auto;font-weight:800;color:var(--pc);white-space:nowrap;font-size:10pt}
.st .k{font-size:8.5pt;color:#5B6B80;font-weight:700;margin:-.8mm 0 1.6mm 11mm}
.row{display:grid;grid-template-columns:24mm 1fr;gap:2mm;margin-top:1.2mm}
.row>i{font-style:normal;font-weight:800;font-size:8.6pt;color:var(--pc);text-transform:uppercase;letter-spacing:.04em;padding-top:.5mm}
.say{background:#F1FAFB;border-radius:2.5mm;padding:1.8mm 2.6mm;font-style:italic}
.say p+p{margin-top:1mm}
.stu{display:flex;flex-wrap:wrap;gap:1.4mm}
.stu em{font-style:normal;background:#EEF2FF;border-radius:9mm;padding:.4mm 2.2mm;font-size:9.5pt}
.tl{display:flex;flex-wrap:wrap;gap:1.2mm}
.tl em{font-style:normal;font-size:8.6pt;font-weight:800;border-radius:9mm;padding:.3mm 2mm;background:#E8F6F8;color:#004A5C}
.tl em.tel{background:#FDE68A;color:#7A4A00}
.ft{margin-top:4mm;font-size:8.5pt;color:#7a889b;text-align:center}
</style></head><body>
<script>
const SC = window.SCEN, L = DATA.lesson, PC = ["#0E7490", "#0E7490", "#00799A", "#0369A1", "#D97706"];
const SH = { speak: "№1 · спикерлер", t1: "№2", t2: "№3", t3: "№4 + постер инфографикасы", t4: "№5", t5: "№6", t6: "№7 (қағаз нұсқасы)" };
let tm = 0, h = `<div class="hero"><small>МҰҒАЛІМГЕ · САБАҚТЫ ӨТКІЗУ СЦЕНАРИЙІ</small><h1>«Экосканер»: сабақты қадам-қадаммен қалай өткіземін?</h1><p>${L.subject} · ${L.topic} (${L.para}) · ${L.teacher} · ${L.date}<br>Тақтадағы «Келесі →» батырмасы кезеңді ауыстырады. Әр кезеңде экранда оқушыларға «🧑‍🎓 Сен не істейсің?» жолағы өзі шығады.</p></div>`;
h += `<h2>Сабаққа дейін</h2><div class="chk">${SC.before.map(x => `<div>${x}</div>`).join("")}</div>`;
h += `<div class="rule"><div><b>📵 Телефон</b>тек хатшыда, квизде және пікір кезеңінде</div><div><b>✍️ Парақ</b>тапсырмалардың бәрі жұмыс парағында және тақтада</div><div><b>⏱ Уақыт</b>таймер өзі санайды; 1 мин қалғанда дыбыс шығады</div></div>`;
h += `<h2>Сабақтың барысы</h2>`;
DATA.stages.forEach((s, i) => { const c = SC.stages[s.id]; if (!c) return;
  const pc = PC[s.part] || "#00799A";
  h += `<div class="st" style="--pc:${pc}"><div class="h"><div class="n">${i + 1}</div><b>${s.title}</b><span>${s.min ? `${tm}–${tm + s.min} мин` : "—"}</span></div><div class="k">${s.kicker}${SH[s.id] ? " · парақ " + SH[s.id] : ""}</div>
   <div class="row"><i>🗣 Айтасыз</i><div class="say">${c.say.map(p => { const m = p.match(/^\(([^)]*)\)\s*(.*)$/); return m ? `<p><b style="font-style:normal;color:#0E7490">${m[1]}:</b> «${m[2]}»</p>` : `<p>«${p}»</p>`; }).join("")}</div></div>
   <div class="row"><i>🖱 Басасыз</i><div>${c.press}</div></div>
   <div class="row"><i>🧑‍🎓 Оқушылар</i><div class="stu">${c.stu.map((x, k) => `<em>${k + 1}. ${x}</em>`).join("")}</div></div>
   <div class="row"><i>Құрал</i><div class="tl">${c.tools.map(t => `<em class="${t}">${SC.tools[t]}</em>`).join("")}${c.tip ? `<span style="font-size:9pt;color:#7A4A00;font-weight:700">💡 ${c.tip}</span>` : ""}</div></div></div>`;
  tm += s.min || 0; });
h += `<div class="ft">Барлығы ${tm} минут · Сайт: makpalkubantova-arch.github.io/ecoscaner · Бұл бетті телефоннан да ашуға болады: ecoscaner/print/scenariy.html</div>`;
document.body.innerHTML = h;
</script>
</body></html>
