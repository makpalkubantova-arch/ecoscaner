<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<title>Спикерге көмек парағы · Экосканер</title>
<link rel="stylesheet" href="../vendor/golos.css">
<script src="../data.js"></script><script src="spiker-data.js"></script>
<style>
@page{size:A4 portrait;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Golos Text',sans-serif;color:#13233a;background:#d9e3ee;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;background:#fff;margin:0 auto 8mm;position:relative;overflow:hidden;page-break-after:always}
@media print{body{background:#fff}.page{margin:0}}
/* СЫРТЫ: тақырып + сурет (сыныпқа көрсетіледі) */
.front{display:grid;grid-template-columns:1fr 1fr;background:linear-gradient(135deg,var(--c2),var(--c3));color:#fff}
.front .art{display:grid;place-items:center;padding:12mm}.front .art svg{width:120mm;height:120mm}
.front .tx{padding:16mm 16mm 16mm 4mm;display:flex;flex-direction:column;justify-content:center;gap:7mm}
.front .no{width:26mm;height:26mm;border-radius:50%;background:#fff;color:var(--c2);display:grid;place-items:center;font-size:44pt;font-weight:800}
.front .k{font-size:13pt;font-weight:800;letter-spacing:.16em;opacity:.85}
.front h1{font-size:52pt;line-height:1.02;font-weight:800}
.front .big{display:flex;align-items:baseline;gap:5mm}.front .big b{font-size:60pt;font-weight:800;color:#FFE38A;line-height:1}.front .big span{font-size:16pt;font-weight:700;line-height:1.2}
.front .who{background:rgba(255,255,255,.95);color:#13233a;border-radius:6mm;padding:4mm 6mm;font-size:15pt;font-weight:800}
.front .who small{display:block;font-size:11pt;font-weight:600;color:#5B6B66;margin-top:1mm}
/* ІШІ: спикердің сөзі */
.back{padding:12mm 16mm 12mm;display:flex;flex-direction:column;gap:5mm}
.back .hd{display:flex;align-items:center;gap:5mm;border-bottom:1mm solid var(--c2);padding-bottom:4mm}
.back .hd .n{width:16mm;height:16mm;border-radius:50%;background:var(--c2);color:#fff;display:grid;place-items:center;font-weight:800;font-size:24pt;flex:none}
.back .hd h2{font-size:24pt;line-height:1.1;color:var(--c2)}.back .hd p{font-size:12pt;color:#5B6B66;font-weight:700}
.back .hd .tm{margin-left:auto;background:var(--soft);color:var(--c2);font-weight:800;font-size:14pt;border-radius:9mm;padding:2mm 6mm;white-space:nowrap}
.sp{display:flex;flex-direction:column;gap:4.6mm}
.sp p{font-size:19pt;line-height:1.4}
.sp p.q{background:var(--soft);border-left:2.5mm solid var(--c2);border-radius:3mm;padding:3mm 5mm;font-weight:800;color:var(--c2)}
.ft{position:absolute;left:16mm;right:16mm;bottom:5mm;display:flex;justify-content:space-between;font-size:8pt;color:#8a98aa}
.sheet{display:flex;flex-direction:column}
.sheet .front{height:118mm;grid-template-columns:92mm 1fr}.sheet .front .art{padding:6mm}.sheet .front .art svg{width:80mm;height:80mm}
.sheet .front .tx{padding:8mm 10mm 8mm 0;gap:3.5mm}.sheet .front .no{width:16mm;height:16mm;font-size:26pt}.sheet .front .k{font-size:10pt}
.sheet .front h1{font-size:32pt}.sheet .front .big b{font-size:36pt}.sheet .front .big span{font-size:12pt}.sheet .front .who{font-size:12pt;padding:3mm 4mm}.sheet .front .who small{font-size:9.5pt}
.sheet .back{flex:1;padding:8mm 12mm 12mm;gap:4mm}.sheet .back .hd h2{font-size:18pt}.sheet .back .hd .n{width:12mm;height:12mm;font-size:18pt}.sheet .back .hd p{font-size:10pt}.sheet .back .hd .tm{font-size:11pt}
.sheet .sp{gap:3mm}.sheet .sp p{font-size:13.5pt;line-height:1.38}.sheet .ft{left:12mm;right:12mm}
.tips{display:flex;gap:3mm}.tips div{flex:1;background:var(--soft);border-radius:3mm;padding:2.4mm 3mm;font-size:9.5pt;line-height:1.3;font-weight:600}.tips b{color:var(--c2)}
</style></head><body>
<script src="spiker-scenes.js"></script>
<script>
const SP = window.SPEECH, TB = DATA.learnTabs, DARK = { g1: "#991B1B", g2: "#9A3412", g3: "#0369A1" }, DARK3 = { g1: "#C2410C", g2: "#B45309", g3: "#0E7490" }, SOFT = { g1: "#FDECEC", g2: "#FFF0E6", g3: "#E6F6FD" };
let h = "";
SP.forEach((sp, k) => {
  const G = DATA.groups[sp.g], c2 = DARK[sp.g], tab = TB[sp.tab], title = tab.t.replace(/^\d+ · /, ""), sci = sp.sci.split(" (")[0];
  const st = `--c2:${c2};--c3:${DARK3[sp.g]};--soft:${SOFT[sp.g]}`;
  h += `<div class="page sheet" style="${st}">
   <section class="front" style="${st};display:grid">
    <div class="art">${window.SCENES[k]}</div>
    <div class="tx"><div class="no">${k + 1}</div><div class="k">${k + 1}-СПИКЕР · ${G.n.toUpperCase()}</div><h1>${title}</h1>
      <div class="big"><b>${sp.big}</b><span>${sp.bigT}</span></div>
      <div class="who">🎭 Мен — ${sp.sci}<small>${sp.sciT}</small></div></div>
   </section>
   <section class="back" style="${st}">
    <div class="hd"><div class="n">${k + 1}</div><div><h2>Менің сөзім</h2><p>Сен — ${sci} рөліндесің · ${G.n} · ${sp.n}</p></div><div class="tm">⏱ 1 минут</div></div>
    <div class="sp">${sp.s.map((p, i) => `<p class="${i === sp.s.length - 1 ? "q" : ""}">${p}</p>`).join("")}</div>
    <div class="tips"><div><b>1.</b> «Мен…» деп ғалымның атынан сөйле.</div><div><b>2.</b> Оқып тұрма — алдын ала оқып, өз сөзіңмен айт.</div><div><b>3.</b> Соңында сыныпқа сұрағыңды қой.</div></div>
    <div class="ft"><span>География · 11-сынып · Қоршаған ортаның сапасы · ${tab.src}</span><span>Спикерге көмек парағы</span></div>
   </section></div>`;
});
document.body.insertAdjacentHTML("beforeend", h);
</script>
</body></html>
