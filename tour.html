<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Экосканер · Қоршаған ортаның сапасы · бейне</title>
<link href="vendor/geo-fonts.css" rel="stylesheet">
<style>
:root{--or:#F97316;--or2:#FDBA74;--tl:#14B8A6;--sky:#0EA5E9;--display:'Montserrat','Arial Black',Arial,sans-serif;--body:'Nunito','Segoe UI',Arial,sans-serif}
html,body{margin:0;height:100%;background:#020814;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font-family:var(--body);color:#fff;background:radial-gradient(1200px 800px at 70% 50%,#0B2340 0%,#030A18 60%,#01040B 100%)}
#g{position:absolute;inset:0}
.vig{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(1,6,16,.85) 0%,rgba(1,6,16,.4) 36%,rgba(1,6,16,0) 54%),linear-gradient(0deg,rgba(1,6,16,.75) 0%,rgba(1,6,16,0) 22%)}
.top{position:absolute;left:64px;right:64px;top:40px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:14px;font:800 19px var(--display);letter-spacing:3px;color:#7DD3FC;text-transform:uppercase;white-space:nowrap}
.brand i{font-style:normal;display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#0EA5E9,#14B8A6);color:#fff;font:900 13px/1.05 var(--display);letter-spacing:1px;text-align:center}
.chips{display:flex;gap:9px;margin-left:auto}
.chip{display:flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font:800 22px var(--display);color:rgba(255,255,255,.5)}

.src{margin-top:16px;font:700 16px var(--body);color:rgba(255,255,255,.5)}

.row b{font-family:var(--display)}
.row .ic{flex:none;width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:30px}
.row small{display:block;font-size:17px;opacity:.75;font-weight:700}
.big{font:900 64px/1 var(--display);background:linear-gradient(180deg,#FFE0B8,#FDBA74 45%,#F97316);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);max-width:1500px;padding:14px 30px;border-radius:20px;background:rgba(2,10,22,.75);border:1px solid rgba(255,255,255,.12);font:700 32px/1.32 var(--body);text-align:center;text-wrap:balance;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.hero{position:absolute;left:96px;top:250px;width:980px}
.hero .k{font:800 20px var(--display);letter-spacing:4px;color:#7DD3FC}
.hero .t1{font:900 96px/1.02 var(--display);margin-top:14px;text-shadow:0 10px 40px rgba(0,0,0,.6)}
.hero .t1 em{font-style:normal;background:linear-gradient(180deg,#FFE0B8,#FDBA74 45%,#F97316);-webkit-background-clip:text;background-clip:text;color:transparent}
.goal{margin-top:26px;display:inline-flex;gap:14px;align-items:center;background:linear-gradient(90deg,rgba(20,184,166,.95),rgba(14,165,233,.95));border-radius:20px;padding:14px 22px;font:800 25px/1.3 var(--body)}
.flt{display:flex;gap:10px;margin-top:18px}
.flt span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:9px 16px;font:800 19px var(--body)}
.lvl{display:inline-block;border-radius:10px;padding:3px 10px;font:800 17px var(--display);color:#fff}
</style>
</head>
<body>

  <div class="panel" id="panel"></div>
  <div class="sub" id="sub"></div>

<script src="data.js"></script>
<script src="tour-data.js"></script>
<script src="tour-timing.js"></script>

<script type="module">
